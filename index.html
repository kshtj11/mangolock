<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>mangolock</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #000;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
}

#app {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 480px;
  height: 480px;
  background: #090909;
  overflow: hidden;
  touch-action: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 60px;
}

.greeting {
  font-size: 15px;
  font-weight: 300;
  color: #888;
  letter-spacing: 0.02em;
}

/* mode toggle button — top right corner */
#mode-btn {
  position: absolute;
  top: 16px;
  right: 16px;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: #1e1e1e;
  color: #ccc;
  font-size: 15px;
  font-weight: 500;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  user-select: none;
  touch-action: none;
  transition: background 0.15s;
  z-index: 10;
}
#mode-btn:active { background: #2a2a2a; }

.grid {
  display: grid;
  grid-template-columns: repeat(4, 88px);
  grid-template-rows: repeat(3, 80px);
  gap: 8px;
}

/* touch target — fills the full grid cell */
.cap-cell {
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  user-select: none;
  touch-action: none;
}

.cap-cell.popped {
  pointer-events: none;
}

/* visual-only capsule inside the touch target */
.cap-vis {
  --a: 0deg;
  width: 60px;
  height: 23px;
  border-radius: 100px;
  background: #bfbfbf;
  transform: rotate(var(--a));
  transform-origin: center;
  pointer-events: none;
  flex-shrink: 0;
  /* transitions power modes 2 & 3; animations override for mode 1 */
  transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1),
              width    0.2s  ease;
}

/* mode 1 — pop: shrink → bounce → scale out */
.cap-cell.popped .cap-vis {
  animation: cap-pop 0.42s ease forwards;
}

@keyframes cap-pop {
  0%   { width: 60px; transform: rotate(var(--a)) scale(1);    opacity: 1; }
  42%  { width: 23px; transform: rotate(var(--a)) scale(1);    opacity: 1; }
  56%  { width: 23px; transform: rotate(var(--a)) scale(1.08); opacity: 1; }
  100% { width: 23px; transform: rotate(var(--a)) scale(0);    opacity: 0; }
}

/* mode 3 — circle toggle */
.cap-vis.is-circle {
  width: 23px;
}
</style>
</head>
<body>
<div id="app">
  <span class="greeting">Hello, fellow tinkerer!</span>
  <div class="grid" id="g"></div>
  <div id="mode-btn">1</div>
</div>
<script>
var ANGLES = [
  90, -42,  0,  32,
   0,  90, 28, -34,
  38,   0, 28,  90
];

var mode = 1;
var caps = []; // { cell, vis, origAngle, angle, isCircle }

// build grid
var g = document.getElementById('g');
ANGLES.forEach(function(a) {
  var cell = document.createElement('div');
  cell.className = 'cap-cell';

  var vis = document.createElement('div');
  vis.className = 'cap-vis';
  cell.appendChild(vis);

  var c = { cell: cell, vis: vis, origAngle: a, angle: a, isCircle: false };
  caps.push(c);

  vis.style.setProperty('--a', a + 'deg');

  cell.addEventListener('pointerdown', function(e) {
    e.preventDefault();
    cell.setPointerCapture(e.pointerId);
    dispatch(c);
  });

  // hide cell after pop animation completes
  vis.addEventListener('animationend', function() {
    cell.style.visibility = 'hidden';
  });

  g.appendChild(cell);
});

// mode dispatch
function dispatch(c) {
  if (mode === 1) {
    if (!c.cell.classList.contains('popped')) {
      c.cell.classList.add('popped');
    }
  } else if (mode === 2) {
    c.angle += 45;
    c.vis.style.setProperty('--a', c.angle + 'deg');
  } else if (mode === 3) {
    c.isCircle = !c.isCircle;
    c.vis.classList.toggle('is-circle', c.isCircle);
  }
}

// mode button
var btn = document.getElementById('mode-btn');
btn.addEventListener('pointerdown', function(e) {
  e.preventDefault();
  btn.setPointerCapture(e.pointerId);
  mode = (mode % 3) + 1;
  btn.textContent = mode;
  resetAll();
});

function resetAll() {
  caps.forEach(function(c) {
    // drop pop animation by removing class, then force reflow
    c.cell.classList.remove('popped');
    void c.vis.offsetWidth;

    // clear inline overrides left by mode 1
    c.cell.style.visibility = '';

    // reset mode 3 toggle
    c.isCircle = false;
    c.vis.classList.remove('is-circle');

    // reset mode 2 rotation to original
    c.angle = c.origAngle;
    c.vis.style.setProperty('--a', c.origAngle + 'deg');
  });
}
</script>
</body>
</html>
